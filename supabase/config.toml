# Agent credentials are verified inside the function using per-agent hashes.
# Supabase JWT verification remains disabled because autonomous agents are not
# issued human Supabase sessions or project signing secrets.
[functions.agent-gateway]
verify_jwt = false

# Thin MCP protocol adapter. It forwards the caller's opaque agent credential
# to agent-gateway, which remains the sole authentication and policy engine.
[functions.agent-gateway-mcp]
verify_jwt = false

# Public HighLevel webhook endpoint. Supabase JWT verification is intentionally
# disabled because HighLevel authenticates deliveries with X-GHL-Signature.
# The function verifies the current Ed25519 signature before parsing or acting.
[functions.ghl-stage-events]
verify_jwt = false

# Evergreen-controlled HighLevel workflow webhook. Supabase JWT verification is
# disabled because the function authenticates a dedicated Bearer token by
# hashing it and comparing it with CASH_STAGE_WORKFLOW_TOKEN_SHA256.
# The raw workflow token is never stored in Postgres or exposed to Cash.
[functions.cash-stage-trigger]
verify_jwt = false

# Public webhook: Meta/Twilio cannot present a Supabase JWT. Authenticity is
# established by provider signature verification inside the function, and
# authorship separately by the inbound_senders allowlist.
[functions.whatsapp-inbound]
verify_jwt = false
