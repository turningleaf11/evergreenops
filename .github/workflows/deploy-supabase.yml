name: Deploy Supabase

# Deploy database migrations and edge functions to the opshq Supabase project.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dsxrekabnwvarnroanny

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Reconcile migration history
        shell: bash
        run: ./scripts/reconcile-migration-history.sh

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy daily briefing function
        run: supabase functions deploy daily-briefing --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy CEO triage function
        run: supabase functions deploy ceo-triage --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy cadence generator function
        run: supabase functions deploy cadences-generate --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway function
        run: supabase functions deploy agent-gateway --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway MCP adapter
        run: supabase functions deploy agent-gateway-mcp --project-ref "$SUPABASE_PROJECT_ID"
