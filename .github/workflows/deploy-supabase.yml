name: Deploy Supabase

# Deploy database migrations and edge functions to the opshq Supabase project.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dsxrekabnwvarnroanny

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Reconcile legacy remote migration history
        shell: bash
        run: |
          set -euo pipefail

          # Before migration history was consistently source-controlled, opshq
          # accumulated remote-only migration versions. Some historical SQL also
          # contains credential-like literals, so do not export those statements
          # into this public repository just to satisfy the CLI history check.
          #
          # Materialize no-op local markers only for that frozen legacy cohort.
          # Any remote-only migration newer than this cutoff is unexpected drift
          # and fails the deployment instead of being silently accepted.
          legacy_cutoff="20260903223617"
          migration_list="$(supabase migration list --linked --password "$SUPABASE_DB_PASSWORD")"
          printf '%s\n' "$migration_list"

          mapfile -t remote_only < <(
            printf '%s\n' "$migration_list" | awk -F'|' '
              function trim(s) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", s); return s }
              NF >= 2 {
                local = trim($1)
                remote = trim($2)
                if (local == "" && remote ~ /^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$/) print remote
              }
            '
          )

          for version in "${remote_only[@]}"; do
            if [[ "$version" > "$legacy_cutoff" ]]; then
              echo "ERROR: unexpected remote-only migration $version is newer than legacy cutoff $legacy_cutoff"
              echo "Add the real migration file to GitHub or repair the remote history explicitly."
              exit 1
            fi

            if compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              continue
            fi

            marker="supabase/migrations/${version}_legacy_remote_history.sql"
            cat > "$marker" <<EOF
          -- Historical migration-history marker for opshq production version ${version}.
          --
          -- This version predates canonical migration source control. Its production
          -- migration record remains authoritative. The historical SQL is intentionally
          -- not exported here because legacy records may contain credential-like literals.
          -- This marker is a no-op and exists only to make local/remote version history
          -- comparable for Supabase CLI deployments.
          EOF
            echo "Materialized legacy migration marker: $marker"
          done

          # Re-list after reconciliation. From this point forward, any new remote-only
          # migration must fail above and be fixed at the source rather than normalized.
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy daily briefing function
        run: supabase functions deploy daily-briefing --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy CEO triage function
        run: supabase functions deploy ceo-triage --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy cadence generator function
        run: supabase functions deploy cadences-generate --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway function
        run: supabase functions deploy agent-gateway --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway MCP adapter
        run: supabase functions deploy agent-gateway-mcp --project-ref "$SUPABASE_PROJECT_ID"
