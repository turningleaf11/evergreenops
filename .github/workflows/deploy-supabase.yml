name: Deploy Supabase

# Deploy database migrations and edge functions to the opshq Supabase project.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dsxrekabnwvarnroanny

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Reconcile frozen legacy migration baseline
        shell: bash
        run: |
          set -euo pipefail

          # Migration history before this boundary was created by multiple deploy
          # paths and was not consistently source-controlled. Freeze that cohort
          # as an already-applied baseline without replaying its SQL.
          #
          # Some historical production records contain credential-like literals,
          # so their raw statements must not be exported into this public repo.
          # Any mismatch NEWER than this cutoff is a real deployment error and
          # fails closed instead of being normalized.
          legacy_cutoff="20260903223617"

          list_mismatches() {
            supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | awk -F'|' '
              function clean(s) {
                gsub(/[`[:space:]]/, "", s)
                return s
              }
              NF >= 2 {
                local_version = clean($1)
                remote_version = clean($2)
                version_re = "^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]$"
                if (local_version ~ version_re && remote_version == "") print "local " local_version
                if (local_version == "" && remote_version ~ version_re) print "remote " remote_version
              }
            '
          }

          mapfile -t mismatches < <(list_mismatches)
          legacy_local_only=()
          legacy_remote_only=()

          for mismatch in "${mismatches[@]}"; do
            side="${mismatch%% *}"
            version="${mismatch##* }"

            if [[ "$version" > "$legacy_cutoff" ]]; then
              echo "ERROR: $side-only migration $version is newer than frozen legacy cutoff $legacy_cutoff"
              echo "Fix the migration at the source; post-cutoff history must match GitHub exactly."
              exit 1
            fi

            case "$side" in
              local) legacy_local_only+=("$version") ;;
              remote) legacy_remote_only+=("$version") ;;
              *) echo "ERROR: unrecognized migration mismatch: $mismatch"; exit 1 ;;
            esac
          done

          # Local-only legacy files describe schema changes that production has
          # already absorbed through the pre-canonical deploy history. Record the
          # versions as applied; do not execute those historical migrations now.
          if (( ${#legacy_local_only[@]} > 0 )); then
            echo "Freezing ${#legacy_local_only[@]} legacy local-only migration versions as applied."
            supabase migration repair "${legacy_local_only[@]}" \
              --linked --password "$SUPABASE_DB_PASSWORD" --status applied
          fi

          # Remote-only legacy versions remain authoritative in production. Add
          # ephemeral no-op files so the CLI can compare the frozen histories
          # without publishing old SQL or credential-like literals.
          for version in "${legacy_remote_only[@]}"; do
            if compgen -G "supabase/migrations/${version}_*.sql" > /dev/null; then
              continue
            fi

            marker="supabase/migrations/${version}_legacy_remote_history.sql"
            cat > "$marker" <<EOF
          -- Frozen historical migration marker for opshq production version ${version}.
          -- This no-op file exists only during CI deployment history reconciliation.
          -- Historical SQL is intentionally not exported to the public repository.
          EOF
            echo "Materialized legacy remote marker: $marker"
          done

          # After the one-time baseline reconciliation there must be zero local /
          # remote version mismatches. This is the invariant for all future work.
          mapfile -t remaining < <(list_mismatches)
          if (( ${#remaining[@]} > 0 )); then
            printf 'ERROR: migration history still differs after legacy reconciliation:\n'
            printf '  %s\n' "${remaining[@]}"
            exit 1
          fi

          echo "Supabase migration history is aligned at the canonical boundary."

      - name: Apply database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy daily briefing function
        run: supabase functions deploy daily-briefing --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy CEO triage function
        run: supabase functions deploy ceo-triage --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy cadence generator function
        run: supabase functions deploy cadences-generate --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway function
        run: supabase functions deploy agent-gateway --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Agent Gateway MCP adapter
        run: supabase functions deploy agent-gateway-mcp --project-ref "$SUPABASE_PROJECT_ID"
