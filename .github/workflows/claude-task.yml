name: Claude Code Task Runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task ID from Supabase
        required: true
      task_title:
        description: Task title
        required: true
      task_description:
        description: Task description and plan from Claude
        required: true
      task_notes:
        description: Additional notes from Albus
        required: false
        default: ''

jobs:
  run-task:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Create task branch
        id: branch
        env:
          TASK_TITLE: ${{ inputs.task_title }}
        run: |
          SLUG=$(echo "$TASK_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g' | cut -c1-50)
          BRANCH="task/${SLUG}"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> $GITHUB_OUTPUT

      - name: Build prompt file
        env:
          TASK_DESCRIPTION: ${{ inputs.task_description }}
          TASK_NOTES: ${{ inputs.task_notes }}
        run: |
          echo "$TASK_DESCRIPTION" > /tmp/prompt.txt
          if [ -n "$TASK_NOTES" ]; then
            echo "" >> /tmp/prompt.txt
            echo "Additional context from Albus: $TASK_NOTES" >> /tmp/prompt.txt
          fi

      - name: Run Claude Code
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: claude -p "$(cat /tmp/prompt.txt)" --dangerously-skip-permissions

      - name: Commit and push
        env:
          TASK_TITLE: ${{ inputs.task_title }}
        run: |
          git config user.name "Claude Code"
          git config user.email "claude-code@anthropic.com"
          git add -A
          git diff --staged --quiet || git commit -m "task: $TASK_TITLE"
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_TITLE: ${{ inputs.task_title }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          gh pr create \
            --title "$TASK_TITLE" \
            --body "Implemented by Claude Code. Task ID: $TASK_ID" \
            --base main \
            --head "${{ steps.branch.outputs.name }}"

      - name: Mark task done in Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/agent_tasks?id=eq.$TASK_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"done\",\"completed_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Mark task failed in Supabase
        if: failure()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TASK_ID: ${{ inputs.task_id }}
        run: |
          curl -s -X PATCH \
            "$SUPABASE_URL/rest/v1/agent_tasks?id=eq.$TASK_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"needs_input\",\"error\":\"GitHub Actions workflow failed — check the Actions tab for details\"}"
