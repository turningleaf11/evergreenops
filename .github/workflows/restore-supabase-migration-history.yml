name: Restore Supabase Migration History

on:
  push:
    branches:
      - fix/supabase-migration-history-fetch
    paths:
      - ".github/workflows/restore-supabase-migration-history.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dsxrekabnwvarnroanny

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preserve canonical migrations from main
        shell: bash
        run: |
          rm -rf /tmp/main-tree /tmp/repo-migrations
          mkdir -p /tmp/main-tree
          git archive origin/main supabase/migrations | tar -x -C /tmp/main-tree
          cp -a /tmp/main-tree/supabase/migrations /tmp/repo-migrations

      - name: Fetch remote migration history into a clean directory
        shell: bash
        run: |
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          printf 'y\n' | supabase migration fetch --linked

      - name: Merge remote history with canonical main migrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import hashlib
          import re
          import shutil

          original = Path('/tmp/repo-migrations')
          target = Path('supabase/migrations')

          def version_of(path: Path):
              match = re.match(r'^(\d{14})_.*\.sql$', path.name)
              return match.group(1) if match else None

          def normalized_bytes(path: Path):
              text = path.read_text(encoding='utf-8').replace('\r\n', '\n')
              text = '\n'.join(line.rstrip() for line in text.split('\n')).strip() + '\n'
              return text.encode('utf-8')

          remote_files = [p for p in target.glob('*.sql') if version_of(p)]
          remote_by_version = {version_of(p): p for p in remote_files}
          remote_by_hash = defaultdict(list)
          for path in remote_files:
              remote_by_hash[hashlib.sha256(normalized_bytes(path)).hexdigest()].append(path)

          aliases = []
          unmatched_local = []
          same_version_preserved = 0

          for src in sorted(original.iterdir()):
              if not src.is_file():
                  continue
              version = version_of(src)
              if not version:
                  # Preserve legacy nonconforming files. Supabase ignores them for
                  # migration-version parity, so they are not part of this repair.
                  shutil.copy2(src, target / src.name)
                  continue

              if version in remote_by_version:
                  # Keep the repository-authored source when the exact version is
                  # already tracked remotely. Version parity is what the CLI uses.
                  for fetched in target.glob(f'{version}_*.sql'):
                      fetched.unlink()
                  shutil.copy2(src, target / src.name)
                  same_version_preserved += 1
                  continue

              digest = hashlib.sha256(normalized_bytes(src)).hexdigest()
              matches = remote_by_hash.get(digest, [])
              if matches:
                  aliases.append((src.name, matches[0].name))
                  continue

              # Not proven equivalent yet. Keep it for explicit investigation;
              # never silently drop a unique migration from Git history.
              shutil.copy2(src, target / src.name)
              unmatched_local.append(src.name)

          versions = {}
          duplicates = []
          for path in sorted(target.glob('*.sql')):
              version = version_of(path)
              if not version:
                  continue
              if version in versions:
                  duplicates.append((version, versions[version], path.name))
              versions[version] = path.name

          if duplicates:
              raise SystemExit(f'duplicate migration versions after merge: {duplicates}')

          print(f'Remote migration versions fetched: {len(remote_by_version)}')
          print(f'Canonical migration versions after merge: {len(versions)}')
          print(f'Same-version repository files preserved: {same_version_preserved}')
          print(f'Exact alternate-timestamp aliases removed: {len(aliases)}')
          for local_name, remote_name in aliases:
              print(f'ALIAS {local_name} -> {remote_name}')
          print(f'Unmatched local-only migrations retained for review: {len(unmatched_local)}')
          for name in unmatched_local:
              print(f'LOCAL_ONLY {name}')
          PY

      - name: Inspect migration parity without applying SQL
        shell: bash
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          set +e
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run
          dry_run_status=$?
          set -e
          echo "Supabase dry-run exit status: $dry_run_status"
          exit 0

      - name: Commit reconciled migration files
        shell: bash
        run: |
          if git diff --quiet -- supabase/migrations && [ -z "$(git ls-files --others --exclude-standard supabase/migrations)" ]; then
            echo "No migration files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A supabase/migrations
          git commit -m "Reconcile Supabase migration history"
          git push origin HEAD:fix/supabase-migration-history-fetch
