name: Restore Supabase Migration History

on:
  push:
    branches:
      - fix/supabase-migration-history-fetch
    paths:
      - ".github/workflows/restore-supabase-migration-history.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dsxrekabnwvarnroanny

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN secret" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "Missing SUPABASE_DB_PASSWORD secret" && exit 1)

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preserve repository migrations
        shell: bash
        run: |
          rm -rf /tmp/repo-migrations
          mkdir -p /tmp/repo-migrations
          cp -a supabase/migrations/. /tmp/repo-migrations/

      - name: Fetch remote migration history
        shell: bash
        run: |
          printf 'y\n' | supabase migration fetch --linked

      - name: Prefer canonical repository files on overlapping versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          original = Path('/tmp/repo-migrations')
          target = Path('supabase/migrations')
          target.mkdir(parents=True, exist_ok=True)

          for src in sorted(original.iterdir()):
              if not src.is_file():
                  continue
              match = re.match(r'^(\d{14})_.*\.sql$', src.name)
              if match:
                  version = match.group(1)
                  for fetched in target.glob(f'{version}_*.sql'):
                      fetched.unlink()
              shutil.copy2(src, target / src.name)

          versions = {}
          duplicates = []
          for path in sorted(target.glob('*.sql')):
              match = re.match(r'^(\d{14})_.*\.sql$', path.name)
              if not match:
                  continue
              version = match.group(1)
              if version in versions:
                  duplicates.append((version, versions[version], path.name))
              versions[version] = path.name

          if duplicates:
              raise SystemExit(f'duplicate migration versions after merge: {duplicates}')
          print(f'Canonical migration files: {len(versions)}')
          PY

      - name: Verify migration history parity without applying SQL
        shell: bash
        run: |
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Commit restored migration files
        shell: bash
        run: |
          if git diff --quiet -- supabase/migrations && [ -z "$(git ls-files --others --exclude-standard supabase/migrations)" ]; then
            echo "No migration files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Restore production Supabase migration history"
          git push origin HEAD:fix/supabase-migration-history-fetch
